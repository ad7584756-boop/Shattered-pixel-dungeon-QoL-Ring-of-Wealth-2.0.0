name: Build Android APK (debug)

on:
  workflow_dispatch:
    inputs:
      boss_music_url:
        description: Public download URL for hall BOSS theme.mp3
        required: false
        type: string
      final_boss_music_url:
        description: Public download URL for hall final BOSS theme.mp3
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate optional music inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BOSS_MUSIC_URL: ${{ inputs.boss_music_url }}
          FINAL_BOSS_MUSIC_URL: ${{ inputs.final_boss_music_url }}
        run: |
          if [[ -n "$BOSS_MUSIC_URL" && -z "$FINAL_BOSS_MUSIC_URL" ]] || [[ -z "$BOSS_MUSIC_URL" && -n "$FINAL_BOSS_MUSIC_URL" ]]; then
            echo "Provide both boss music URLs, or leave both empty."
            exit 1
          fi

      - name: Download custom Overkill boss music
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.boss_music_url != '' && inputs.final_boss_music_url != '' }}
        env:
          BOSS_MUSIC_URL: ${{ inputs.boss_music_url }}
          FINAL_BOSS_MUSIC_URL: ${{ inputs.final_boss_music_url }}
        run: |
          set -euo pipefail
          mkdir -p core/src/main/assets/music
          curl --fail --location --retry 3 "$BOSS_MUSIC_URL" -o core/src/main/assets/music/halls_overkill_boss.mp3
          curl --fail --location --retry 3 "$FINAL_BOSS_MUSIC_URL" -o core/src/main/assets/music/halls_overkill_boss_finale.mp3
          test -s core/src/main/assets/music/halls_overkill_boss.mp3
          test -s core/src/main/assets/music/halls_overkill_boss_finale.mp3
          file core/src/main/assets/music/halls_overkill_boss.mp3 core/src/main/assets/music/halls_overkill_boss_finale.mp3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 36 platform and build tools
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" --sdk_root="$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build installable debug APK
        run: ./gradlew android:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pixel-dungeon-qol-1.0.6-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
